local_conf_header:
  standard: |
    CONF_VERSION = "2"
    PACKAGE_CLASSES = "package_ipk"
    SDKMACHINE = "x86_64"
    USER_CLASSES = "buildstats"
    PATCHRESOLVE = "noop"
    DL_DIR ?= "/home/rog/Desktop/project/down_cache/downloads"
    SSTATE_DIR ?= "/home/rog/Desktop/project/down_cache/sstate-cache"
    
    INHERIT += "image-buildinfo" 
    INHERIT += "buildhistory"
    BUILDHISTORY_COMMIT = "1"
# INHERIT += "image-buildinfo" ==> Output: The file is created at /etc/build or /etc/buildinfo on the target device.
# This class generates build statistics per task and image, helping to identify build time bottlenecks.  ==> Output is stored in build/tmp/buildstats/ (or the path defined by BUILDSTATS_BASE).   

  debug-tweaks: |
    EXTRA_IMAGE_FEATURES = "debug-tweaks tools-profile dbg-pkgs allow-empty-password empty-root-password allow-root-login post-install-logging"
    DEBUG_BUILD = "1"
    INHIBIT_PACKAGE_STRIP = "1"

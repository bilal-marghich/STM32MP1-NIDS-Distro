header:
  version: 14

machine: stm32mp1
distro: canary
target: core-image-minimal

repos:
  bitbake:
    url: "https://github.com/openembedded/bitbake.git"
    branch: "2.8"
    commit: "cff3be6f664f8f07a40727ff63eeeb24d6f5e00b"
    layers: {}
    #path: bitbake

  openembedded-core:
    url: "https://github.com/openembedded/openembedded-core.git"
    branch: "scarthgap"
    commit: "048f2f8e8864ae5861afe95ea52efc0354bfc18c"
    layers:
      meta:
    #path: openembedded-core
  
  meta-openembedded:
    url: "https://github.com/openembedded/meta-openembedded.git"
    branch: "scarthgap"
    commit: "b5874ea07d69919d9b40d59f2c2f0bbd24bc3259"
    layers:
      meta-oe:
      meta-python:


  meta-st-stm32mp:
    url: "https://github.com/STMicroelectronics/meta-st-stm32mp.git"
    path: "meta-st-stm32mp"
    branch: "scarthgap"
    commit: "99e728c23eb1478e4af1e27f17a8fe93cfd80295"

  meta-canary-bsp:
     path: "../../meta-canary-bsp"

  meta-canary-distro:
    path: "../../meta-canary-distro"
  
  meta-canary-project:
    path: "../../meta-canary-project"
    
